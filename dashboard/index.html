<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FX Signal Board</title>
<style>
  :root {
    --bg:#0a0e13; --surf:#111820; --bord:#1e2b3a;
    --text:#cdd9e5; --muted:#576a7d; --dim:#1e2d3d;
    --buy:#00dc37; --sell:#f85149; --amber:#e3b341;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    padding:10px;max-width:430px;margin:0 auto;
  }

  /* TOP BAR */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .app-name{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .scan-info{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--muted);}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--buy);
       box-shadow:0 0 5px rgba(0,220,55,.6);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .gear-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0 2px;line-height:1;}
  .td-key-row{display:none;align-items:center;gap:6px;margin-bottom:6px;padding:6px 8px;background:var(--surf);border:1px solid var(--bord);border-radius:8px;font-size:10px;}
  .td-key-row.open{display:flex;flex-direction:column;align-items:stretch;}
  .td-key-row input{flex:1;background:var(--dim);border:1px solid var(--bord);border-radius:4px;padding:4px 6px;color:var(--text);font-size:10px;outline:none;}
  .td-key-row button{background:var(--bord);border:none;border-radius:4px;color:var(--text);font-size:9px;padding:4px 8px;cursor:pointer;white-space:nowrap;}

  /* MARKET STATE */
  .mstate{
    border-radius:10px;padding:9px 13px;margin-bottom:7px;
    background:var(--surf);border:1.5px solid var(--bord);
    transition:border-color .4s,box-shadow .4s;
  }
  .mstate.ro {border-color:rgba(248,81,73,.5);box-shadow:0 0 14px rgba(248,81,73,.08);}
  .mstate.ron{border-color:rgba(0,220,55,.5); box-shadow:0 0 14px rgba(0,220,55,.08);}
  .mstate.mix{border-color:rgba(227,179,65,.35);}
  .ms-lbl{font-size:8px;font-weight:700;letter-spacing:.08em;
           text-transform:uppercase;color:var(--muted);}
  .ms-lbl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
  .ms-row{display:flex;align-items:center;justify-content:space-between;}
  .ms-item{display:flex;flex-direction:column;gap:2px;align-items:center;flex:1;}
  .ms-key{font-size:8px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
  .ms-val{font-size:12px;font-weight:800;text-align:center;}
  .ms-sub{font-size:8px;color:var(--muted);text-align:center;}
  .ms-div{width:1px;height:30px;background:var(--bord);flex-shrink:0;}
  .ms-confluence{
    font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 7px;border-radius:3px;
    background:rgba(0,220,55,.15);border:1px solid rgba(0,220,55,.35);
    color:var(--buy);
  }
  .ms-confluence.ro{
    background:rgba(248,81,73,.15);border-color:rgba(248,81,73,.35);color:var(--sell);
  }
  /* Macro card */
  .macro-card{
    border-radius:10px;padding:8px 13px;margin-bottom:7px;
    background:var(--surf);border:1px solid var(--bord);
  }

  /* NEWS */
  .news{background:var(--surf);border:1px solid var(--bord);border-radius:10px;
        padding:7px 12px;margin-bottom:7px;display:flex;align-items:flex-start;gap:8px;}
  .news-line{width:2px;min-width:2px;height:26px;border-radius:2px;
             background:var(--sell);margin-top:1px;transition:background .4s;}
  .news-line.ron{background:var(--buy);}
  .news-line.mix{background:var(--amber);}
  .news-lbl{font-size:8px;font-weight:700;text-transform:uppercase;
             letter-spacing:.07em;color:var(--muted);margin-bottom:2px;opacity:.6;}
  .news-txt{font-size:10px;color:var(--muted);line-height:1.4;}
  #analysis-txt{font-size:10px;color:var(--muted);line-height:1.55;}

  /* CSM */
  .csm-wrap{
    background:var(--surf);border:1px solid var(--bord);border-radius:10px;
    padding:9px 12px;margin-bottom:10px;cursor:pointer;user-select:none;
  }
  .csm-wrap:active{opacity:.8;}
  .csm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .csm-ttl{font-size:8px;font-weight:700;text-transform:uppercase;
            letter-spacing:.07em;color:var(--muted);}
  .csm-tf{color:var(--text);font-weight:700;}
  .csm-bars{display:flex;gap:3px;align-items:flex-end;height:34px;}
  .csm-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;}
  .csm-b{width:100%;border-radius:2px;min-height:2px;transition:height .35s,background .35s;}
  .csm-l{font-size:7px;font-weight:700;text-transform:uppercase;}

  /* GRID */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}

  /* PAIR BLOCK */
  .block{
    background:var(--surf);border:1px solid var(--bord);border-radius:10px;
    padding:8px 10px;cursor:pointer;user-select:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .block.bear-hi{border-color:rgba(248,81,73,.5);
    box-shadow:0 0 10px rgba(248,81,73,.09),inset 0 0 18px rgba(248,81,73,.03);}
  .block.bear-med{border-color:rgba(248,81,73,.28);}
  .block.bull-hi{border-color:rgba(0,220,55,.5);
    box-shadow:0 0 10px rgba(0,220,55,.09);}
  .block.bull-med{border-color:rgba(0,220,55,.28);}

  /* Top row: pair + changes */
  .b-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px;}
  .b-pair{font-size:12px;font-weight:700;letter-spacing:.02em;padding-top:1px;}
  .b-chgs{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
  .b-d1{font-size:11px;font-weight:700;}
  .b-d5{font-size:8px;color:var(--muted);font-weight:600;}

  /* Flip face area */
  .b-face{margin-bottom:7px;}

  /* PILLS face */
  .pills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:3px;}
  .tf-lbl{text-align:center;font-size:7px;font-weight:700;
           color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
  .pill{height:22px;border-radius:4px;display:flex;align-items:center;
        justify-content:center;font-size:13px;font-weight:700;}
  .pill.bull_strong{background:rgba(0,220,55,.22); color:var(--buy);}
  .pill.bull       {background:rgba(0,220,55,.13); color:var(--buy);}
  .pill.neutral    {background:rgba(46,58,72,.5);  color:#3a4d5e;}
  .pill.bear       {background:rgba(248,81,73,.13);color:var(--sell);}
  .pill.bear_strong{background:rgba(248,81,73,.22);color:var(--sell);}

  /* CONT row */
  .cont-row{display:flex;align-items:baseline;justify-content:space-between;
             margin-top:5px;padding-top:5px;border-top:1px solid var(--dim);}
  .cont-lbl{font-size:8px;font-weight:700;text-transform:uppercase;
             letter-spacing:.06em;color:var(--muted);}
  .cont-val{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}

  /* Correlates */
  .b-corr{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;}
  .corr-tag{font-size:8px;font-weight:700;letter-spacing:.01em;}

  /* MOM face */
  .mom-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:3px;}
  .mom-val{text-align:center;font-size:14px;font-weight:700;
           font-variant-numeric:tabular-nums;line-height:1.1;}
  .mom-dlt{text-align:center;font-size:9px;font-weight:700;
           font-variant-numeric:tabular-nums;}
  .mom-sep{height:1px;background:var(--dim);margin:5px 0 4px;}
  .mom-bot{display:flex;align-items:baseline;justify-content:space-between;}
  .mom-lbl{font-size:8px;font-weight:700;text-transform:uppercase;
            letter-spacing:.06em;color:var(--muted);}
  .mom-big{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;}
  .adx-val{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;}

  /* CSM pair bar */
  .b-csm{display:flex;align-items:center;gap:4px;padding-top:6px;border-top:1px solid var(--dim);}
  .csm-base{font-size:8px;font-weight:700;min-width:20px;}
  .csm-track{flex:1;height:2px;background:var(--dim);border-radius:1px;overflow:hidden;position:relative;}
  .csm-fill{position:absolute;height:100%;border-radius:1px;transition:width .3s;}
  .csm-quote{font-size:8px;font-weight:700;min-width:20px;text-align:right;}

  /* Loading */
  .loading{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
</style>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<div class="topbar">
  <div class="app-name">FX Signal Board</div>
  <div class="scan-info">
    <div class="dot"></div><span id="scan-time">Loading…</span>
    <button class="gear-btn" onclick="toggleKeyRow()" title="API keys">⚙</button>
  </div>
</div>
<div class="td-key-row" id="td-key-row">
  <div style="display:flex;align-items:center;gap:6px;">
    <span style="color:var(--muted);white-space:nowrap;min-width:42px;">TD Key</span>
    <input type="password" id="td-key-inp" placeholder="paste Twelvedata key…">
    <button onclick="saveTdKey()">Save</button>
    <button onclick="clearTdKey()">Clear</button>
  </div>
  <div style="display:flex;align-items:center;gap:6px;margin-top:5px;padding-top:5px;border-top:1px solid var(--bord);">
    <span style="color:var(--muted);white-space:nowrap;min-width:42px;">GH PAT</span>
    <input type="password" id="cht-pat-inp" placeholder="paste GitHub PAT…" style="flex:1;background:var(--dim);border:1px solid var(--bord);border-radius:4px;padding:4px 6px;color:var(--text);font-size:10px;outline:none;">
    <button onclick="chtSavePat()">Save</button>
    <button onclick="chtClearPat()">Clear</button>
  </div>
</div>

<div class="mstate" id="mstate">
  <div class="ms-lbl-row">
    <div class="ms-lbl">Regime</div>
    <span id="ms-confluence" style="display:none"></span>
  </div>
  <div class="ms-row" id="ms-row">
    <div class="ms-item"><div class="ms-key">—</div><div class="ms-val">…</div></div>
  </div>
</div>

<div class="macro-card" id="macro-card">
  <div class="ms-lbl-row">
    <div class="ms-lbl">Macro</div>
  </div>
  <div class="ms-row" id="macro-row">
    <div class="ms-item"><div class="ms-val" style="color:var(--muted)">…</div></div>
  </div>
</div>

<div class="news" id="news-wrap">
  <div class="news-line" id="news-line"></div>
  <div>
    <div class="news-lbl" id="news-lbl">NEWS · —</div>
    <div class="news-txt" id="news-themes">Loading…</div>
    <div class="news-txt" id="news-event" style="margin-top:3px;opacity:.75;"></div>
  </div>
</div>

<div class="news" id="analysis-wrap" style="margin-top:-3px;">
  <div class="news-line" style="background:var(--amber);"></div>
  <div>
    <div class="news-lbl" id="analysis-lbl">AI ANALYSIS · —</div>
    <div class="news-txt" id="analysis-txt">Loading…</div>
  </div>
</div>

<div class="csm-wrap" onclick="toggleCSM()">
  <div class="csm-head">
    <div class="csm-ttl">Currency Strength · <span class="csm-tf" id="csm-tf">D1</span></div>
  </div>
  <div class="csm-bars" id="csm-bars"><div class="loading">—</div></div>
</div>

<div class="grid" id="pair-grid"><div class="loading" style="grid-column:1/-1">Loading…</div></div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const REPO     = "Pieter800320/fx-signal-board";
const API_BASE = `https://api.github.com/repos/${REPO}/contents/data/signals.json`;

const PAIRS_ORDER = [
  "EURUSD","GBPUSD","USDJPY","USDCHF",
  "AUDUSD","USDCAD","NZDUSD",
  "EURJPY","GBPJPY","AUDJPY","NZDJPY","CADJPY"
];

function getCorrelates(pair){
  const corr = D && D.correlations;
  if(!corr) return [];
  const idx = corr.pairs.indexOf(pair);
  if(idx < 0) return [];
  const result = [];
  corr.pairs.forEach((cp, j) => {
    if(j === idx) return;
    const v = corr.matrix[idx][j];
    if(v === null || Math.abs(v) < 0.70) return;
    result.push({cp, same: v > 0, strength: Math.abs(v)});
  });
  result.sort((a, b) => b.strength - a.strength);
  return result.slice(0, 3);
}

// ── STATE ────────────────────────────────────────────────────────────────────
let D        = null;   // signals.json
let csmTf    = "d1";
const face   = {};
PAIRS_ORDER.forEach(p => face[p] = 0);

// ── FETCH ────────────────────────────────────────────────────────────────────
async function loadData(){
  try {
    const res = await fetch(API_BASE, {
      headers: {"Accept": "application/vnd.github.v3.raw"},
      cache:   "no-store",
    });
    if (!res.ok) throw new Error(res.status);
    D = await res.json();
    render();
  } catch(e) {
    document.getElementById("scan-time").textContent = "Error loading data";
    console.error(e);
  }
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function fmtTime(iso){
  if (!iso) return "—";
  const d = new Date(iso);
  return d.getUTCHours().toString().padStart(2,"0") + ":" +
         d.getUTCMinutes().toString().padStart(2,"0") + " UTC";
}

function regimeColor(r){
  if (r === "Risk-Off") return "var(--sell)";
  if (r === "Risk-On")  return "var(--buy)";
  if (r === "Mixed")    return "var(--amber)";
  return "var(--muted)";
}

function mstateClass(r){
  if (r === "Risk-Off") return "mstate ro";
  if (r === "Risk-On")  return "mstate ron";
  if (r === "Mixed")    return "mstate mix";
  return "mstate";
}

function pillArrow(p){
  if (p === "bull_strong" || p === "bull") return "↑";
  if (p === "bear_strong" || p === "bear") return "↓";
  return "·";
}

function momColor(v){
  if (v === null || v === undefined) return "var(--muted)";
  return v >= 65 ? "var(--buy)" : v >= 35 ? "var(--amber)" : "var(--sell)";
}

function deltaColor(d){
  if (d === null || d === undefined) return "var(--muted)";
  return d > 0 ? "var(--buy)" : d < 0 ? "var(--sell)" : "var(--muted)";
}

function deltaStr(d){
  if (d === null || d === undefined) return "—";
  return (d > 0 ? "+" : "") + d;
}

function adxColor(v){
  if (!v) return "var(--muted)";
  return v >= 55 ? "var(--amber)" : v >= 25 ? "var(--buy)" : v >= 20 ? "var(--amber)" : "var(--muted)";
}

function contColor(v){
  return v >= 70 ? "var(--buy)" : v >= 50 ? "var(--amber)" : v >= 35 ? "rgba(248,140,0,.8)" : "var(--sell)";
}

function fmtPct(v){
  if (v === null || v === undefined) return "—";
  return (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  if (!D) return;

  // Scan time
  document.getElementById("scan-time").textContent =
    "Scanned " + fmtTime(D.updated);

  renderMarketState();
  renderNews();
  renderCSM();
  renderGrid();
}

function renderMarketState(){
  const d1  = D.regime_d1 || {};
  const h4  = D.regime_h4 || {};
  const h1  = D.regime_h1 || {};
  const mac = D.macro     || {};

  // Outer card border reflects H4 (primary trading TF)
  const el = document.getElementById("mstate");
  el.className = mstateClass(h4.regime);

  // Confluence pill — show when all 3 agree on a directional regime
  const confEl = document.getElementById("ms-confluence");
  const aligned = d1.regime && d1.regime === h4.regime && h4.regime === h1.regime
                  && !["Mixed","Ranging"].includes(h4.regime);
  if (confEl) {
    if (aligned) {
      confEl.textContent = "⚡ Confluence";
      confEl.className   = "ms-confluence" + (h4.regime === "Risk-Off" ? " ro" : "");
      confEl.style.display = "";
    } else {
      confEl.style.display = "none";
    }
  }

  // 3-column regime row
  const col = (lbl, r) => `
    <div class="ms-item">
      <div class="ms-key">${lbl}</div>
      <div class="ms-val" style="color:${regimeColor(r.regime)}">${r.regime||"—"}</div>
      <div class="ms-sub">${r.confidence||"—"} · ${r.stable?"Stable":"Shifting"}</div>
    </div>`;

  document.getElementById("ms-row").innerHTML =
    col("D1", d1) +
    '<div class="ms-div"></div>' +
    col("H4", h4) +
    '<div class="ms-div"></div>' +
    col("H1", h1);

  // Macro card
  const w1  = D.regime_w1 || {};
  document.getElementById("macro-row").innerHTML =
    `<div class="ms-item">
       <div class="ms-key">W1</div>
       <div class="ms-val" style="color:${regimeColor(w1.regime)}">${w1.regime||"—"}</div>
       <div class="ms-sub">${w1.confidence||"—"} · ${w1.stable?"Stable":"Shifting"}</div>
     </div>
     <div class="ms-div"></div>
     <div class="ms-item">
       <div class="ms-key">D1</div>
       <div class="ms-val" style="color:${regimeColor(mac.label)}">${mac.label||"—"}</div>
       <div class="ms-sub">${mac.confidence||"—"} · ${mac.stable?"Stable":"Shifting"}</div>
     </div>`;
}

function renderNews(){
  const news     = D.news     || {};
  const analysis = D.analysis || {};
  const mac      = D.macro    || {};
  const line     = document.getElementById("news-line");
  const r        = mac.label  || "";
  line.className = "news-line" + (r==="Risk-On"?" ron":r==="Mixed"?" mix":"");

  document.getElementById("news-lbl").textContent =
    "NEWS · " + fmtTime(news.updated);
  document.getElementById("news-themes").textContent =
    news.themes || "Awaiting scan…";
  document.getElementById("news-event").textContent =
    news.event  || "";

  document.getElementById("analysis-lbl").textContent =
    "AI ANALYSIS · " + fmtTime(analysis.updated);
  document.getElementById("analysis-txt").textContent =
    analysis.text || "Awaiting scan…";
}

function renderCSM(){
  const data = D.csm?.[csmTf] || {};
  document.getElementById("csm-tf").textContent = csmTf.toUpperCase();

  // Sort weakest → strongest
  const sorted = Object.entries(data).sort((a, b) => a[1] - b[1]);

  document.getElementById("csm-bars").innerHTML = sorted.map(([cur, val]) => {
    const h   = Math.round(3 + val * 0.31) + "px";
    const col = val >= 60 ? "var(--buy)" : val <= 40 ? "var(--sell)" : "#576a7d";
    return `<div class="csm-col">
      <div class="csm-b" style="height:${h};background:${col}"></div>
      <div class="csm-l" style="color:${col}">${cur}</div>
    </div>`;
  }).join("");
}

function toggleCSM(){
  csmTf = csmTf === "d1" ? "h4" : csmTf === "h4" ? "h1" : "d1";
  renderCSM();
  renderGrid();
}

// ── BLOCK RENDERING ──────────────────────────────────────────────────────────
const TFS = ["d1","h4","h1"];

function pillsFace(pair, p){
  const pills  = p.pills || {};
  const labels = TFS.map(t => `<div class="tf-lbl">${t.toUpperCase()}</div>`).join("");
  const pillH  = TFS.map(t => {
    const v = pills[t] || "neutral";
    return `<div class="pill ${v}">${pillArrow(v)}</div>`;
  }).join("");

  const cont    = p.cont ?? 0;
  const contCol = contColor(cont);

  // Correlation display: computed from D.correlations
  const d1p = pills.d1 || "neutral";
  const corrHtml = getCorrelates(pair).map(({ cp, same }) => {
    const dir = same
      ? (d1p.includes("bull") ? "↑" : d1p.includes("bear") ? "↓" : "·")
      : (d1p.includes("bull") ? "↓" : d1p.includes("bear") ? "↑" : "·");
    const col = dir === "↑" ? "var(--buy)" : dir === "↓" ? "var(--sell)" : "var(--muted)";
    return `<span class="corr-tag" style="color:${col}">${cp} ${dir}</span>`;
  }).join("");

  return `<div class="b-face">
    <div class="pills-grid">${labels}</div>
    <div class="pills-grid">${pillH}</div>
    <div class="cont-row">
      <span class="cont-lbl">Cont.</span>
      <span class="cont-val" style="color:${contCol}">${cont}%</span>
    </div>
    ${corrHtml ? `<div class="b-corr">${corrHtml}</div>` : ""}
  </div>`;
}

function momFace(p){
  const mom = p.mom || {};
  const labels = TFS.map(t => `<div class="tf-lbl">${t.toUpperCase()}</div>`).join("");
  const vals   = TFS.map(t => {
    const v = mom[t];
    return `<div class="mom-val" style="color:${momColor(v)}">${v ?? "—"}</div>`;
  }).join("");
  const dlts   = TFS.map(t => {
    const d = mom["d" + t];
    return `<div class="mom-dlt" style="color:${deltaColor(d)}">${deltaStr(d)}</div>`;
  }).join("");

  const cmp = mom.cmp;
  const adx = p.adx;

  return `<div class="b-face">
    <div class="mom-grid">${labels}</div>
    <div class="mom-grid">${vals}</div>
    <div class="mom-grid">${dlts}</div>
    <div class="mom-sep"></div>
    <div class="mom-bot">
      <span class="mom-lbl">CMP</span>
      <span class="mom-big" style="color:${momColor(cmp)}">${cmp ?? "—"}</span>
      <span style="color:var(--muted);font-size:11px;padding:0 6px">·</span>
      <span class="mom-lbl">ADX</span>
      <span class="adx-val" style="color:${adxColor(adx)}">${adx ?? "—"}</span>
    </div>
  </div>`;
}

function pairCSMBar(pair){
  const data = D.csm?.[csmTf] || {};
  const base  = pair.slice(0, 3);
  const quote = pair.slice(3);
  const bv    = data[base]  ?? 50;
  const qv    = data[quote] ?? 50;
  const tot   = bv + qv || 1;
  const bPct  = Math.round(bv / tot * 100);
  const bCol  = bv > qv ? "var(--buy)" : "var(--sell)";
  const qCol  = qv > bv ? "var(--buy)" : "var(--sell)";
  return `<div class="b-csm">
    <span class="csm-base"  style="color:${bCol}">${base} ${bv}</span>
    <div class="csm-track">
      <div class="csm-fill" style="width:${bPct}%;background:${bCol}"></div>
    </div>
    <span class="csm-quote" style="color:${qCol}">${quote} ${qv}</span>
  </div>`;
}

function blockHTML(pair){
  const p   = (D.pairs || {})[pair] || {};
  const cls = p.regime_cls || "";
  const d1p = p.d1_pct;
  const d5p = p.d5_pct;
  const d1Pos = d1p !== null && d1p !== undefined && d1p >= 0;

  return `<div class="block ${cls}" onclick="flipBlock('${pair}')">
    <div class="b-top">
      <span class="b-pair">${pair}</span>
      <div class="b-chgs">
        <span id="d1-${pair}" class="b-d1" style="color:${d1Pos?"var(--buy)":"var(--sell)"}">${fmtPct(d1p)}</span>
        <span id="d5-${pair}" class="b-d5" style="color:${d5p!=null?(d5p>=0?"var(--buy)":"var(--sell)"):"var(--muted)"}">${fmtPct(d5p)}</span>
      </div>
    </div>
    ${face[pair] === 0 ? pillsFace(pair, p) : momFace(p)}
    ${pairCSMBar(pair)}
  </div>`;
}

function renderGrid(){
  const sorted = [...PAIRS_ORDER].sort((a, b) =>
    (D.pairs?.[b]?.cont ?? 0) - (D.pairs?.[a]?.cont ?? 0));
  document.getElementById("pair-grid").innerHTML =
    sorted.map(p => D.pairs?.[p] ? blockHTML(p) :
      `<div class="block"><div class="b-pair">${p}</div><div style="color:var(--muted);font-size:9px;margin-top:4px">No data</div></div>`
    ).join("");
}

function flipBlock(pair){
  face[pair] = face[pair] === 0 ? 1 : 0;
  renderGrid();
}

// ── TD KEY (used for OHLCV chart fetches only) ───────────────────────────────
const LS_KEY = 'fsb_td_key';

function toggleKeyRow(){
  const row = document.getElementById('td-key-row');
  row.classList.toggle('open');
  if(row.classList.contains('open')){
    const saved = localStorage.getItem(LS_KEY);
    document.getElementById('td-key-inp').placeholder =
      saved ? 'Key saved ✓ (enter new to replace)' : 'paste Twelvedata key…';
    chtUpdatePatPlaceholder();
  }
}
function saveTdKey(){
  const inp = document.getElementById('td-key-inp');
  const val = inp.value.trim();
  if(!val) return;
  localStorage.setItem(LS_KEY, val);
  inp.value = ''; inp.placeholder = 'Key saved ✓';
}
function clearTdKey(){
  localStorage.removeItem(LS_KEY);
  document.getElementById('td-key-inp').placeholder = 'paste Twelvedata key…';
}

function updatePairPcts(){} // no-op: pair % updates come from scan data only

// ── INIT + REFRESH ────────────────────────────────────────────────────────────
loadData();
setInterval(loadData, 5 * 60 * 1000);  // refresh every 5 minutes
</script>

<script>
// ════════════════════════════════════════════════════════════════════════
//  FSB Chart overlay  — all identifiers prefixed cht_ to avoid collisions
// ════════════════════════════════════════════════════════════════════════

const CHT_LA_KEY  = 'fsb_la_v1';
const CHT_PAT_KEY = 'fsb_gh_pat';
const CHT_IND_KEY = 'fsb_ind_v1';
const CHT_LA_PATH = 'data/level_alerts.json';

const CHT_IND_DEFAULTS = { ema200:true, ema50:true, bb:true, macd:true };

// ── State ─────────────────────────────────────────────────────────────────────
let _chtPair      = null;
let _chtTf        = 'H4';
let _chtInst      = null;
let _chtMacdInst  = null;
let _chtCandles   = null;
let _chtPriceLine = null;
let _chtAlertRefs = [];
let _chtOhlcvCache = {};
let _chtTimerInt  = null;
let _chtIndState  = null;

// Drawing state
let _chtDrawMode    = false;
let _chtStagingLine = null;
let _chtStagingPrice= null;
let _chtSelectedId  = null;
let _chtDragging    = false;
let _chtMouseDown   = false;
let _chtLongTimer   = null;
let _chtDrawInited  = false;

// ── localStorage helpers ──────────────────────────────────────────────────────
const laLoad = () => { try { return JSON.parse(localStorage.getItem(CHT_LA_KEY) || '[]'); } catch { return []; } };
const laSave = a  => localStorage.setItem(CHT_LA_KEY, JSON.stringify(a));

// ── Indicator state ───────────────────────────────────────────────────────────
function chtLoadIndState() {
  try { _chtIndState = { ...CHT_IND_DEFAULTS, ...JSON.parse(localStorage.getItem(CHT_IND_KEY) || '{}') }; }
  catch { _chtIndState = { ...CHT_IND_DEFAULTS }; }
}
function chtSaveIndState() { localStorage.setItem(CHT_IND_KEY, JSON.stringify(_chtIndState)); }

function chtUpdateIndChips() {
  ['ema200','ema50','bb','macd'].forEach(k => {
    const btn = document.getElementById('cht-ind-' + k);
    if (btn) btn.classList.toggle('on', !!_chtIndState[k]);
  });
}

function chtToggleInd(key) {
  if (!_chtIndState) return;
  _chtIndState[key] = !_chtIndState[key];
  chtSaveIndState();
  chtUpdateIndChips();
  chtSetPaneSizes();
  _chtLoadAndRender();
}

// ── GitHub PAT ────────────────────────────────────────────────────────────────
function chtSavePat() {
  const v = document.getElementById('cht-pat-inp').value.trim();
  if (!v) return;
  localStorage.setItem(CHT_PAT_KEY, v);
  document.getElementById('cht-pat-inp').value = '';
  document.getElementById('cht-pat-inp').placeholder = 'PAT saved ✓';
  chtSetGhStatus('PAT saved');
}
function chtClearPat() {
  localStorage.removeItem(CHT_PAT_KEY);
  document.getElementById('cht-pat-inp').placeholder = 'paste GitHub PAT…';
  chtSetGhStatus('PAT cleared');
}
function chtSetGhStatus(msg) {
  const el = document.getElementById('cht-gh-status');
  if (!el) return;
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 3000);
}
function chtUpdatePatPlaceholder() {
  const inp = document.getElementById('cht-pat-inp');
  if (!inp) return;
  inp.placeholder = localStorage.getItem(CHT_PAT_KEY) ? 'PAT saved ✓ (enter new to replace)' : 'paste GitHub PAT…';
}

// ── GitHub push ───────────────────────────────────────────────────────────────
async function chtPushToGitHub(ghPath, data) {
  const pat = localStorage.getItem(CHT_PAT_KEY);
  if (!pat) { chtSetGhStatus('No PAT — saved locally only'); return; }
  const apiUrl = `https://api.github.com/repos/${REPO}/contents/${ghPath}`;
  let sha = null;
  try {
    const r = await fetch(apiUrl, { headers: { 'Authorization': `token ${pat}`, 'Accept': 'application/vnd.github.v3+json' } });
    if (r.ok) { const j = await r.json(); sha = j.sha; }
  } catch(e) {}
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2) + '\n')));
  const body = { message: `fsb: update ${ghPath} ${new Date().toISOString()}`, content };
  if (sha) body.sha = sha;
  try {
    const r = await fetch(apiUrl, {
      method: 'PUT',
      headers: { 'Authorization': `token ${pat}`, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
      body: JSON.stringify(body)
    });
    if (r.ok) { chtSetGhStatus('Synced ✓'); }
    else { const j = await r.json(); console.warn('GitHub push failed:', j); chtSetGhStatus('Push failed'); }
  } catch(e) { console.warn('GitHub push error:', e); chtSetGhStatus('Push error'); }
}

// ── Pane sizing ───────────────────────────────────────────────────────────────
function chtSetPaneSizes() {
  if (!_chtIndState) return;
  const h      = document.getElementById('cht-chart-area').clientHeight;
  if (!h) return;
  const showM  = _chtIndState.macd;
  const priceEl = document.getElementById('cht-price');
  const macdEl  = document.getElementById('cht-macd');
  const divEl   = document.getElementById('cht-divider');
  if (showM) {
    priceEl.style.height = Math.floor(h * 0.65) + 'px';
    macdEl.style.height  = Math.floor(h * 0.35) + 'px';
    macdEl.style.display = '';
    if (divEl) divEl.style.display = '';
  } else {
    priceEl.style.height = h + 'px';
    macdEl.style.height  = '0';
    macdEl.style.display = 'none';
    if (divEl) divEl.style.display = 'none';
  }
}

// ── Open / close ──────────────────────────────────────────────────────────────
function openChart(pair) {
  _chtPair = pair;
  _chtTf   = 'H4';
  chtLoadIndState();
  document.getElementById('cht-pair-lbl').textContent = pair;
  document.getElementById('cht-overlay').classList.add('open');
  ['D1','H4','H1'].forEach(t => document.getElementById('cht-tf-'+t).classList.toggle('active', t === _chtTf));
  chtUpdateIndChips();
  chtUpdatePatPlaceholder();
  chtStartTimer();
  requestAnimationFrame(() => {
    chtSetPaneSizes();
    _chtLoadAndRender();
  });
}

function closeChart() {
  _chtRemoveStaging();
  _chtHideFloatDel();
  document.getElementById('cht-overlay').classList.remove('open');
  _chtDrawMode = false;
  document.getElementById('cht-draw-btn').classList.remove('active');
  _chtDestroyCharts();
  _chtPair = null;
  if (_chtTimerInt) { clearInterval(_chtTimerInt); _chtTimerInt = null; }
}

function _chtDestroyCharts() {
  _chtAlertRefs  = [];
  _chtPriceLine  = null;
  _chtCandles    = null;
  _chtStagingLine = null;  // priceLine ref invalidated; _chtStagingPrice kept for TF-switch restore
  if (_chtInst)     { try { _chtInst.remove();     } catch(e){} _chtInst     = null; }
  if (_chtMacdInst) { try { _chtMacdInst.remove(); } catch(e){} _chtMacdInst = null; }
}

function setChtTf(tf) {
  _chtTf = tf;
  ['D1','H4','H1'].forEach(t => document.getElementById('cht-tf-'+t).classList.toggle('active', t === tf));
  _chtLoadAndRender();
  chtStartTimer();
}

// ── Candle countdown timer ────────────────────────────────────────────────────
function chtStartTimer() {
  if (_chtTimerInt) clearInterval(_chtTimerInt);
  function tick() {
    const el = document.getElementById('cht-timer');
    if (!el) return;
    const secs = { D1:86400, H4:14400, H1:3600 }[_chtTf] || 3600;
    const left = secs - (Math.floor(Date.now() / 1000) % secs);
    const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
    const p = n => String(n).padStart(2,'0');
    el.textContent = h > 0 ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
    el.style.color = left <= 60 ? 'var(--sell)' : 'var(--muted)';
  }
  tick();
  _chtTimerInt = setInterval(tick, 1000);
}

// ── OHLCV fetch ───────────────────────────────────────────────────────────────
async function _chtLoadAndRender() {
  if (!_chtPair) return;
  const pair = _chtPair;
  const tf   = _chtTf;

  if (_chtOhlcvCache[pair]?.[tf]) {
    _chtRender(pair, tf, _chtOhlcvCache[pair][tf]);
    return;
  }

  _chtDestroyCharts();
  document.getElementById('cht-price').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:10px;">Fetching…</div>';

  const key = localStorage.getItem(LS_KEY);
  if (!key) {
    document.getElementById('cht-price').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--sell);font-size:10px;">No TD key — tap ⚙ on main dashboard</div>';
    return;
  }

  const sym      = pair.slice(0,3) + '/' + pair.slice(3);
  const interval = { D1:'1day', H4:'4h', H1:'1h' }[tf];
  const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=${interval}&outputsize=5000&order=ASC&type=price&apikey=${key}`;

  try {
    const r    = await fetch(url);
    const json = await r.json();
    if (!json.values || !json.values.length) throw new Error(json.message || 'no data');
    const ohlcv = json.values.map(v => ({
      time:  Math.floor(new Date(v.datetime + (v.datetime.length === 10 ? 'T00:00:00Z' : 'Z')).getTime() / 1000),
      open:  +v.open, high: +v.high, low: +v.low, close: +v.close
    }));
    if (!_chtOhlcvCache[pair]) _chtOhlcvCache[pair] = {};
    _chtOhlcvCache[pair][tf] = ohlcv;
    if (_chtPair === pair && _chtTf === tf) _chtRender(pair, tf, ohlcv);
  } catch(e) {
    document.getElementById('cht-price').innerHTML =
      `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--sell);font-size:10px;">Fetch error: ${e.message}</div>`;
  }
}

// ── Indicator math ────────────────────────────────────────────────────────────
function chtEMA(closes, period) {
  if (!closes.length) return [];
  const k = 2 / (period + 1);
  const out = new Array(closes.length);
  out[0] = closes[0];
  for (let i = 1; i < closes.length; i++) out[i] = closes[i] * k + out[i-1] * (1-k);
  return out;
}

function chtBB(ohlcv, period=20, mult=2) {
  const closes = ohlcv.map(d => d.close);
  const out = [];
  for (let i = period-1; i < closes.length; i++) {
    const sl   = closes.slice(i-period+1, i+1);
    const mean = sl.reduce((a,b)=>a+b,0) / period;
    const std  = Math.sqrt(sl.reduce((a,b)=>a+(b-mean)**2, 0) / period);
    out.push({ time:ohlcv[i].time, upper:mean+mult*std, middle:mean, lower:mean-mult*std });
  }
  return out;
}

function chtMACD(ohlcv, fast=12, slow=26, sig=9) {
  if (ohlcv.length < slow + sig) return [];
  const closes = ohlcv.map(d => d.close);
  const ema12  = chtEMA(closes, fast);
  const ema26  = chtEMA(closes, slow);
  const macdLn = closes.map((_, i) => ema12[i] - ema26[i]);
  const signal = chtEMA(macdLn, sig);
  const start  = slow + sig - 2;
  return ohlcv.slice(start).map((bar, i) => {
    const idx = start + i;
    return { time:bar.time, macd:macdLn[idx], signal:signal[idx], histogram:macdLn[idx]-signal[idx] };
  });
}

// ── MACD offset helper: find bar index of MACD's first timestamp in ohlcv ────
function _computeSubOffset(macdData, ohlcv) {
  if (!macdData.length || !ohlcv.length) return 0;
  const firstTs = macdData[0].time;
  const idx = ohlcv.findIndex(b => b.time === firstTs);
  return idx >= 0 ? idx : 0;
}

// ── Chart render ──────────────────────────────────────────────────────────────
function _chtRender(pair, tf, ohlcv) {
  _chtDestroyCharts();
  if (!ohlcv.length) return;

  const priceEl = document.getElementById('cht-price');
  const macdEl  = document.getElementById('cht-macd');
  // Force layout flush — ensures chtSetPaneSizes heights are resolved
  const priceH  = priceEl.clientHeight || 300;
  const macdH   = macdEl.clientHeight  || 140;
  priceEl.innerHTML = '';
  macdEl.innerHTML  = '';

  const isJpy    = pair.includes('JPY');
  const dec      = isJpy ? 3 : 5;
  const priceFmt = { type:'price', precision:dec, minMove:isJpy?0.001:0.00001 };
  const ind      = _chtIndState || CHT_IND_DEFAULTS;

  const chartOpts = (el, height, showTime) => ({
    width:  el.clientWidth || window.innerWidth,
    height: el.clientHeight || height,
    layout: { background:{ color:'transparent' }, textColor:'#576a7d' },
    grid:   { vertLines:{ color:'#1e2b3a' }, horzLines:{ color:'#1e2b3a' } },
    rightPriceScale: { borderColor:'#1e2b3a', autoScale:true, scaleMargins:{ top:0.08, bottom:0.08 } },
    timeScale: { borderColor:'#1e2b3a', timeVisible:showTime, secondsVisible:false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    handleScroll: true, handleScale: true,
  });

  const chart = LightweightCharts.createChart(priceEl, chartOpts(priceEl, priceH, true));
  _chtInst = chart;

  const candles = chart.addCandlestickSeries({
    upColor:'rgba(0,220,55,.15)', downColor:'rgba(248,81,73,.15)',
    borderUpColor:'rgba(0,220,55,.8)', borderDownColor:'rgba(248,81,73,.8)',
    wickUpColor:'rgba(0,220,55,.5)',   wickDownColor:'rgba(248,81,73,.5)',
    priceLineVisible:false, lastValueVisible:false, priceFormat:priceFmt,
    autoscaleInfoProvider: (original) => {
      const res = original();
      if (!res || !res.priceRange) return res;
      // Collect all visible bar prices, sort, clip top/bottom 1.5% to ignore outlier wicks
      const { minValue, maxValue } = res.priceRange;
      const range = maxValue - minValue;
      const clip  = range * 0.015;
      return { priceRange: { minValue: minValue + clip, maxValue: maxValue - clip }, margins: res.margins };
    },
  });
  candles.setData(ohlcv);
  _chtCandles = candles;

  const closes = ohlcv.map(d => d.close);

  // EMA 200 — dim white
  if (ind.ema200) {
    const e200 = chtEMA(closes, 200);
    chart.addLineSeries({ color:'#cdd9e5', lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false })
      .setData(ohlcv.map((d,i) => ({ time:d.time, value:e200[i] })));
  }

  // EMA 50 — blue
  if (ind.ema50) {
    const e50 = chtEMA(closes, 50);
    chart.addLineSeries({ color:'#58a6ff', lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false })
      .setData(ohlcv.map((d,i) => ({ time:d.time, value:e50[i] })));
  }

  // Bollinger Bands
  if (ind.bb) {
    const bb = chtBB(ohlcv);
    const bbC = 'rgba(87,106,125,.55)';
    chart.addLineSeries({ color:bbC, lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false }).setData(bb.map(d=>({time:d.time,value:d.upper})));
    chart.addLineSeries({ color:bbC, lineWidth:1, lineStyle:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false }).setData(bb.map(d=>({time:d.time,value:d.middle})));
    chart.addLineSeries({ color:bbC, lineWidth:1, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false }).setData(bb.map(d=>({time:d.time,value:d.lower})));
  }

  // Committed level lines (grey dotted)
  _chtAlertRefs = [];
  laLoad().filter(a => a.pair === pair && a.active).forEach(a => {
    try {
      const pl = candles.createPriceLine({
        price:a.price, color:'rgba(139,148,158,0.65)', lineWidth:1,
        lineStyle:LightweightCharts.LineStyle.Dotted,
        axisLabelVisible:true, title:''
      });
      _chtAlertRefs.push({ id:a.id, priceLine:pl, price:a.price });
    } catch(e) {}
  });

  // Price line — always shows last completed candle close for this TF
  const initPrice = ohlcv[ohlcv.length - 1].close;
  try {
    _chtPriceLine = candles.createPriceLine({
      price:initPrice, color:'rgba(205,217,229,0.75)', lineWidth:1,
      lineStyle:LightweightCharts.LineStyle.Dashed,
      axisLabelVisible:true, title:''
    });
  } catch(e) {}

  // ── MACD pane ────────────────────────────────────────────────────────────────
  const macdData = chtMACD(ohlcv);

  if (ind.macd && macdData.length) {
    const macdChart = LightweightCharts.createChart(macdEl, {
      ...chartOpts(macdEl, macdH, false),
      crosshair: { mode: LightweightCharts.CrosshairMode.Hidden },
      rightPriceScale: { visible:true, borderColor:'#1e2b3a', autoScale:true, scaleMargins:{ top:0.1, bottom:0.1 } },
      timeScale: { visible:false },
      handleScroll: false, handleScale: false,
    });
    _chtMacdInst = macdChart;

    macdChart.addHistogramSeries({ priceLineVisible:false, lastValueVisible:false })
      .setData(macdData.map(d => ({ time:d.time, value:d.histogram, color: d.histogram >= 0 ? 'rgba(0,220,55,.55)' : 'rgba(248,81,73,.55)' })));
    macdChart.addLineSeries({ color:'#58a6ff', lineWidth:1, priceLineVisible:false, lastValueVisible:false })
      .setData(macdData.map(d => ({ time:d.time, value:d.macd })));
    macdChart.addLineSeries({ color:'#cdd9e5', lineWidth:1, priceLineVisible:false, lastValueVisible:false })
      .setData(macdData.map(d => ({ time:d.time, value:d.signal })));

    new ResizeObserver(() => {
      if (_chtMacdInst) _chtMacdInst.applyOptions({ width:macdEl.clientWidth, height:macdEl.clientHeight });
    }).observe(macdEl);
  }

  // ── Time-scale sync: price → MACD via logical range offset ──────────────────
  const _subOffset = macdData.length ? _computeSubOffset(macdData, ohlcv) : 0;
  let _syncRaf = null;
  chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    // Jump button: show when scrolled back more than 5 bars from the right edge
    const jb = document.getElementById('cht-jump-btn');
    if (jb) jb.style.display = (range && range.to < ohlcv.length - 5) ? 'block' : 'none';

    if (!_chtMacdInst || !range) return;
    if (_syncRaf) cancelAnimationFrame(_syncRaf);
    _syncRaf = requestAnimationFrame(() => {
      try {
        _chtMacdInst.timeScale().setVisibleLogicalRange({
          from: range.from - _subOffset,
          to:   range.to   - _subOffset
        });
      } catch(e) {}
    });
  });

  new ResizeObserver(() => {
    if (_chtInst) _chtInst.applyOptions({ width:priceEl.clientWidth, height:priceEl.clientHeight });
  }).observe(priceEl);

  // Set initial visible range (last 150 bars)
  const visN = Math.min(150, ohlcv.length);
  chart.timeScale().setVisibleLogicalRange({ from:ohlcv.length - visN, to:ohlcv.length + 2 });

  // Initial MACD sync after layout settles
  setTimeout(() => {
    if (_chtMacdInst) {
      try {
        const r = chart.timeScale().getVisibleLogicalRange();
        if (r) _chtMacdInst.timeScale().setVisibleLogicalRange({ from:r.from - _subOffset, to:r.to - _subOffset });
      } catch(e) {}
    }
  }, 120);

  // Restore staging line if one was active before TF switch
  if (_chtStagingPrice !== null) {
    _chtSetStaging(_chtStagingPrice);
  }
  // Attach drawing listeners (once only per page load)
  _chtInitDrawListeners();
}

// ── Jump to current ───────────────────────────────────────────────────────────
function chtJumpToCurrent() {
  if (!_chtInst || !_chtPair || !_chtTf) return;
  const ohlcv = _chtOhlcvCache[_chtPair]?.[_chtTf];
  if (!ohlcv) return;
  const visN = Math.min(150, ohlcv.length);
  _chtInst.timeScale().setVisibleLogicalRange({ from:ohlcv.length - visN, to:ohlcv.length + 2 });
}

// ── Drawing system ────────────────────────────────────────────────────────────
function chtToggleDrawMode() {
  _chtDrawMode = !_chtDrawMode;
  document.getElementById('cht-draw-btn').classList.toggle('active', _chtDrawMode);
  document.getElementById('cht-chart-area').classList.toggle('draw-mode', _chtDrawMode);
  if (!_chtDrawMode) _chtRemoveStaging();
}

function _chtSetStaging(price) {
  if (!_chtCandles || price == null) return;
  _chtStagingPrice = price;
  if (_chtStagingLine) {
    try { _chtStagingLine.applyOptions({ price, title:'' }); }
    catch(e) { _chtStagingLine = null; }
  }
  if (!_chtStagingLine) {
    try {
      _chtStagingLine = _chtCandles.createPriceLine({
        price, color:'rgba(227,179,65,0.85)', lineWidth:1,
        lineStyle:LightweightCharts.LineStyle.Dotted,
        axisLabelVisible:true, title:''
      });
    } catch(e) {}
  }
  _chtPositionDirPanel();
}

function _chtPositionDirPanel() {
  if (_chtStagingPrice == null) return;
  const panel   = document.getElementById('cht-dir-panel');
  const area    = document.getElementById('cht-chart-area');
  const priceEl = document.getElementById('cht-price');
  if (!panel || !area || !priceEl) return;
  const clientY = _chtPriceToY(_chtStagingPrice);
  if (clientY == null) return;
  const areaRect = area.getBoundingClientRect();
  const y = clientY - areaRect.top;
  // Clamp so panel stays within price pane
  const priceH = priceEl.clientHeight;
  const panelH = 34;
  const clampedY = Math.max(4, Math.min(priceH - panelH - 4, y - panelH / 2));
  panel.style.top   = clampedY + 'px';
  panel.style.right = '58px';  // left of price axis
  panel.style.display = 'flex';
}

function _chtRemoveStaging() {
  if (_chtStagingLine && _chtCandles) {
    try { _chtCandles.removePriceLine(_chtStagingLine); } catch(e) {}
  }
  _chtStagingLine  = null;
  _chtStagingPrice = null;
  const panel = document.getElementById('cht-dir-panel');
  if (panel) panel.style.display = 'none';
}

function chtCommitStaging(direction) {
  if (_chtStagingPrice == null || !_chtPair) return;
  const price = _chtStagingPrice;
  const id    = Date.now();
  const alerts = laLoad();
  alerts.push({ id, pair:_chtPair, price, direction, active:true });
  laSave(alerts);
  _chtRemoveStaging();
  if (_chtCandles) {
    try {
      const pl = _chtCandles.createPriceLine({
        price, color:'rgba(139,148,158,0.65)', lineWidth:1,
        lineStyle:LightweightCharts.LineStyle.Dotted,
        axisLabelVisible:true, title:''
      });
      _chtAlertRefs.push({ id, priceLine:pl, price });
    } catch(e) {}
  }
  _chtDrawMode = false;
  document.getElementById('cht-draw-btn').classList.remove('active');
  document.getElementById('cht-chart-area').classList.remove('draw-mode');
  chtPushToGitHub(CHT_LA_PATH, alerts);
}

function chtClearLevels() {
  if (!_chtPair) return;
  _chtRemoveStaging();
  _chtHideFloatDel();
  const alerts = laLoad().map(a => a.pair === _chtPair ? { ...a, active:false } : a);
  laSave(alerts);
  _chtAlertRefs.forEach(({ priceLine }) => {
    if (_chtCandles) try { _chtCandles.removePriceLine(priceLine); } catch(e) {}
  });
  _chtAlertRefs = [];
  chtPushToGitHub(CHT_LA_PATH, alerts);
}

function chtDeleteSelectedLevel() {
  if (_chtSelectedId == null) return;
  const id    = _chtSelectedId;
  const alerts = laLoad().map(a => a.id === id ? { ...a, active:false } : a);
  laSave(alerts);
  const ref = _chtAlertRefs.find(r => r.id === id);
  if (ref && _chtCandles) try { _chtCandles.removePriceLine(ref.priceLine); } catch(e) {}
  _chtAlertRefs = _chtAlertRefs.filter(r => r.id !== id);
  _chtHideFloatDel();
  chtPushToGitHub(CHT_LA_PATH, alerts);
}

// ── Float-del helpers ─────────────────────────────────────────────────────────
function _chtShowFloatDel(id, clientX, clientY) {
  _chtSelectedId = id;
  const el = document.getElementById('cht-float-del');
  const ca = document.getElementById('cht-chart-area');
  if (!el || !ca) return;
  const ar = ca.getBoundingClientRect();
  const x  = Math.max(4, Math.min(ar.width  - 32, clientX - ar.left - 14));
  const y  = Math.max(4, Math.min(ar.height - 32, clientY - ar.top  - 14));
  el.style.left    = x + 'px';
  el.style.top     = y + 'px';
  el.style.display = 'flex';
  el.style.alignItems = 'center';
  el.style.justifyContent = 'center';
}
function _chtHideFloatDel() {
  _chtSelectedId = null;
  const el = document.getElementById('cht-float-del');
  if (el) el.style.display = 'none';
}

// ── Coord helpers ─────────────────────────────────────────────────────────────
function _chtBounds() {
  const el = document.getElementById('cht-price');
  return el ? el.getBoundingClientRect() : null;
}
function _chtToPrice(clientY) {
  const r = _chtBounds();
  if (!r || !_chtCandles) return null;
  try { return _chtCandles.coordinateToPrice(clientY - r.top); } catch(e) { return null; }
}
function _chtPriceToY(price) {
  const r = _chtBounds();
  if (!r || !_chtCandles) return null;
  try { const c = _chtCandles.priceToCoordinate(price); return c != null ? c + r.top : null; } catch(e) { return null; }
}
function _chtNearCommitted(clientY) {
  for (const ref of _chtAlertRefs) {
    const ly = _chtPriceToY(ref.price);
    if (ly != null && Math.abs(clientY - ly) < 20) return ref;
  }
  return null;
}
function _chtNearStaging(clientY) {
  if (_chtStagingPrice == null) return false;
  const ly = _chtPriceToY(_chtStagingPrice);
  return ly != null && Math.abs(clientY - ly) < 22;
}

// ── Input listeners (attached once) ──────────────────────────────────────────
function _chtInitDrawListeners() {
  if (_chtDrawInited) return;
  _chtDrawInited = true;

  let _ts = { x:0, y:0, t:0 };

  // ── Touch ──────────────────────────────────────────────────────────────────
  document.addEventListener('touchstart', function(e) {
    if (!_chtInst) return;
    const t = e.touches[0];
    _ts = { x:t.clientX, y:t.clientY, t:Date.now() };
    if (_chtDrawMode) return;
    // Long-press on staging line → drag
    if (_chtNearStaging(t.clientY)) {
      e.preventDefault();
      _chtLongTimer = setTimeout(() => {
        _chtLongTimer = null;
        if (navigator.vibrate) navigator.vibrate(30);
        _chtDragging = true;
      }, 300);
    }
  }, true);

  document.addEventListener('touchmove', function(e) {
    if (_chtLongTimer && (Math.abs(e.touches[0].clientX - _ts.x) > 8 || Math.abs(e.touches[0].clientY - _ts.y) > 8)) {
      clearTimeout(_chtLongTimer); _chtLongTimer = null;
    }
    if (_chtDragging) {
      const p = _chtToPrice(e.touches[0].clientY);
      if (p != null) _chtSetStaging(p);
      e.preventDefault();
    }
  }, { passive:false, capture:true });

  document.addEventListener('touchend', function(e) {
    if (_chtLongTimer) { clearTimeout(_chtLongTimer); _chtLongTimer = null; }
    if (e.target && e.target.closest && e.target.closest('#cht-float-del')) return;
    if (_chtDragging) { _chtDragging = false; return; }
    _chtHideFloatDel();
    const t  = e.changedTouches[0];
    const dx = Math.abs(t.clientX - _ts.x), dy = Math.abs(t.clientY - _ts.y);
    const isTap = dx < 12 && dy < 12 && (Date.now() - _ts.t) < 500;
    if (!isTap) return;
    const r = _chtBounds();
    if (!r) return;
    const inChart = t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom;
    if (_chtDrawMode && inChart) {
      const p = _chtToPrice(t.clientY);
      if (p != null) _chtSetStaging(p);
      _chtDrawMode = false;
      document.getElementById('cht-draw-btn').classList.remove('active');
      document.getElementById('cht-chart-area').classList.remove('draw-mode');
      return;
    }
    if (!inChart) return;
    const ref = _chtNearCommitted(t.clientY);
    if (ref) _chtShowFloatDel(ref.id, t.clientX, t.clientY);
  }, true);

  // ── Mouse ──────────────────────────────────────────────────────────────────
  document.addEventListener('mousedown', function(e) {
    if (!_chtInst || _chtDrawMode) return;
    if (_chtNearStaging(e.clientY)) _chtMouseDown = true;
  }, true);
  document.addEventListener('mousemove', function(e) {
    if (!_chtMouseDown) return;
    const p = _chtToPrice(e.clientY);
    if (p != null) _chtSetStaging(p);
    e.preventDefault();
  }, { passive:false, capture:true });
  document.addEventListener('mouseup', function() { _chtMouseDown = false; }, true);

  document.addEventListener('click', function(e) {
    if (e.target && e.target.closest && e.target.closest('#cht-float-del')) return;
    _chtHideFloatDel();
    if (!_chtDrawMode || !_chtInst) return;
    const r = _chtBounds();
    if (!r) return;
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    const p = _chtToPrice(e.clientY);
    if (p != null) _chtSetStaging(p);
    _chtDrawMode = false;
    document.getElementById('cht-draw-btn').classList.remove('active');
    document.getElementById('cht-chart-area').classList.remove('draw-mode');
  }, true);
}

// ── Copy analysis prompt for Claude FSI plugin ───────────────────────────────
function chtCopyPrompt() {
  if (!_chtPair || !D) return;
  const pair = _chtPair;
  const p    = (D.pairs || {})[pair] || {};
  const pills = p.pills || {};
  const mom   = p.mom   || {};
  const d1r   = D.regime_d1 || {};
  const h4r   = D.regime_h4 || {};
  const h1r   = D.regime_h1 || {};
  const w1r   = D.regime_w1 || {};
  const mac   = D.macro     || {};
  const csmd1 = D.csm?.d1   || {};
  const csmh4 = D.csm?.h4   || {};
  const news  = D.news       || {};
  const anal  = D.analysis   || {};
  const base  = pair.slice(0,3);
  const quote = pair.slice(3);

  // Translate pill values to plain language
  const pillTxt = v => ({
    bull_strong: 'strongly bullish', bull: 'bullish',
    bear_strong: 'strongly bearish', bear: 'bearish',
    neutral: 'neutral'
  })[v] || v || '—';

  // Translate momentum score to plain language
  const momTxt = v => {
    if (v == null) return '—';
    const bias = v >= 65 ? 'bullish bias' : v >= 35 ? 'neutral' : 'bearish bias';
    return `${v}/100 (${bias})`;
  };

  // Translate delta to plain language
  const dltTxt = (k) => {
    const d = mom['d'+k];
    if (d == null) return '';
    return d > 0 ? `, improving (+${d} since last scan)` :
           d < 0 ? `, weakening (${d} since last scan)` : ', unchanged';
  };

  // Translate ADX to plain language
  const adxTxt = v => {
    if (v == null) return '—';
    const str = v >= 50 ? 'strong trend' : v >= 25 ? 'trending' :
                v >= 20 ? 'weak trend' : 'ranging/no trend';
    return `${v} (${str})`;
  };

  // Translate cont score to plain language
  const contTxt = v => {
    if (v == null) return '—';
    const str = v >= 70 ? 'strong alignment' : v >= 50 ? 'moderate alignment' :
                v >= 35 ? 'weak alignment' : 'low/conflicting';
    return `${v}% (${str})`;
  };

  // Translate regime to plain language
  const regStr = (r, lbl) =>
    `${lbl}: ${r.regime||'—'} (confidence: ${r.confidence||'—'}, ${r.stable?'stable':'shifting'})`;

  // CSM ranking — translate scores to descriptive tiers
  const csmRank = (csm) =>
    Object.entries(csm).sort((a,b)=>b[1]-a[1])
      .map(([c,v]) => {
        const tier = v >= 70 ? 'strong' : v >= 55 ? 'mild' : v >= 45 ? 'neutral' : v >= 30 ? 'mild weak' : 'weak';
        return `${c} (${tier})`;
      }).join(', ');

  const prompt =
`I am analysing ${pair} for a potential H4 trade. I have not yet determined direction — please give me an unbiased macro and fundamental assessment.

MARKET REGIME (proprietary multi-timeframe system)
Weekly:  ${regStr(w1r,'W1 cross-asset macro')}
Daily:   ${regStr(d1r,'D1 regime')}
4-Hour:  ${regStr(h4r,'H4 regime')} ← primary trading timeframe
1-Hour:  ${regStr(h1r,'H1 regime')} ← short-term momentum

CROSS-ASSET MACRO
Daily macro reading: ${mac.label||'—'} (confidence: ${mac.confidence||'—'}, ${mac.stable?'stable':'shifting'})

${pair} TECHNICAL PICTURE
Direction signals by timeframe:
  Daily (D1):  ${pillTxt(pills.d1)}
  4-Hour (H4): ${pillTxt(pills.h4)}
  1-Hour (H1): ${pillTxt(pills.h1)}
3-timeframe technical alignment: ${contTxt(p.cont)}
Composite momentum score: ${momTxt(mom.cmp)}
Trend strength: ADX ${adxTxt(p.adx)}
Momentum by timeframe:
  D1: ${momTxt(mom.d1)}${dltTxt('d1')}
  H4: ${momTxt(mom.h4)}${dltTxt('h4')}
  H1: ${momTxt(mom.h1)}${dltTxt('h1')}

CURRENCY STRENGTH (relative ranking across 8 major currencies)
Daily strength, strongest to weakest:   ${csmRank(csmd1)}
4-Hour strength, strongest to weakest:  ${csmRank(csmh4)}

CURRENT NEWS & AI ANALYSIS
News themes: ${news.themes||'—'}
Key event:   ${news.event||'—'}
Automated analysis: ${anal.text||'—'}

QUESTIONS
1. What is the fundamental macro bias for ${pair} right now — bullish ${base} or bullish ${quote}, and why?
2. What do carry rates and the ${base}/${quote} yield differential currently suggest — do they favour longs or shorts?
3. Does the broader risk environment (VIX, equities, safe-haven flows) confirm or contradict the ${d1r.regime||'current'} daily regime reading?
4. Are there macro risk events in the next 48 hours relevant to ${base} or ${quote} I should be aware of?`;

  navigator.clipboard.writeText(prompt).then(() => {
    const btn = document.getElementById('cht-copy-btn');
    if (btn) {
      btn.textContent = '✓';
      btn.style.color = 'var(--buy)';
      setTimeout(() => { btn.textContent = '⧉'; btn.style.color = ''; }, 1800);
    }
  }).catch(() => {
    chtSetGhStatus('Clipboard unavailable');
  });
}
function chtAttachLongPress() {
  document.querySelectorAll('#pair-grid .block').forEach(el => {
    if (el.dataset.chtLp) return;
    el.dataset.chtLp = '1';
    let _lpTimer = null, _lpMoved = false;
    el.addEventListener('pointerdown', e => {
      _lpMoved = false;
      _lpTimer = setTimeout(() => {
        if (_lpMoved) return;
        const pairEl = el.querySelector('.b-pair');
        if (!pairEl) return;
        const pair = pairEl.textContent.trim();
        if (PAIRS_ORDER.includes(pair)) { e.preventDefault(); openChart(pair); }
      }, 500);
    });
    const cancel = () => { if (_lpTimer) { clearTimeout(_lpTimer); _lpTimer = null; } };
    el.addEventListener('pointermove',   () => { _lpMoved = true; cancel(); });
    el.addEventListener('pointerup',     cancel);
    el.addEventListener('pointercancel', cancel);
  });
}

(function() {
  const grid = document.getElementById('pair-grid');
  if (!grid) return;
  const obs = new MutationObserver(chtAttachLongPress);
  obs.observe(grid, { childList:true });
})();
</script>
