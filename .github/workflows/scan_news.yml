name: News Scan

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours — includes 06:00 UTC daily brief (Sonnet)
    - cron: '0 21 * * 0'    # Sunday 21:00 UTC — Week Ahead briefing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan_news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news scan
        env:
          TWELVEDATA_KEY:    ${{ secrets.TWELVEDATA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scanner.scan_news

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git add data/signals.json
          git diff --cached --quiet || git commit -m "chore: news scan $(date -u +%Y-%m-%dT%H:%M)"
          git push
