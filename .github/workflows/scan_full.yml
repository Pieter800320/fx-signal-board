# RETIRED — replaced by scan_h1.yml
# Kept for emergency manual use only. Schedule removed.
name: Full Scan (Retired)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages:    write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full scan
        env:
          TWELVEDATA_KEY:    ${{ secrets.TWELVEDATA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scanner.scan_full

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet || git commit -m "chore: full scan $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
